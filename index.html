<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin-kit home page</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- <link rel="stylesheet" href="css/exp.css"> -->
</head>
<body>
    <div class="container">
        <div class="hero__wrap">
            <section class="hero">
                <nav class="lang__nav">
                    <button class="lang__btn active" aria-current="true"><span>Ru</span></button>
                    <button class="lang__btn"><span>En</span></button>
                </nav>
                <div class="hero__content">
                    <div class="left__side">
                        <div class="header">
                            <div class="header__part_one">Fin</div>
                            <div class="header__part_two"><span>Kit</span></div>
                        </div>
                        <div class="header__description">Гибкая мобильная платформа для быстрой реализации инвестиционных сервисов.</div>
                        <div class="order__demo">
                            <button id="order__demo">Заказать демо</button>
                        </div>
                    </div>
                    <div class="right__side">
                        <img src="images/hand_and_phone.png" alt="Главный экран приложения в смартфоне">
                    </div>
                    <ul class="advantages__list">
                        <li class="advantages__item">
                            <span class="advantages__text">Удобный пользовательский интерфейс</span>
                            <span class="advantages__icon">
                                <img src="/images/advantage_1.svg" alt="преимущество 1">
                            </span>
                        </li>
                        <li class="advantages__item">
                            <span class="advantages__text">Панель администратора для ведения учета</span>
                            <span class="advantages__icon">
                                <img src="/images/advantage_2.svg" alt="преимущество 2">
                            </span>
                        </li>
                        <li class="advantages__item">
                            <span class="advantages__text">Простая интеграция с API</span>
                            <span class="advantages__icon">
                                <img src="/images/advantage_3.svg" alt="преимущество 3">
                            </span>
                        </li>
                        <li class="advantages__item">
                            <span class="advantages__text">Гибкая масштабируемая система</span>
                            <span class="advantages__icon">
                                <img src="/images/advantage_4.svg" alt="преимущество 4">
                            </span>
                        </li>
                    </ul>
                </div>

            </section>
        </div>
    </div>    
</body>
</html>
